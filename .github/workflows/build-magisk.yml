name: Build Magisk Zygisk module

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-magisk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: bash .github/scripts/setup-android.sh
      - name: Build APK
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Build Zygisk library
        shell: pwsh
        run: ./build-zygisk.ps1 -NdkRoot (Join-Path $env:ANDROID_HOME 'ndk/27.2.12479018')
      - name: Package Magisk module
        shell: pwsh
        run: ./build-magisk.ps1 -ApkPath app/build/outputs/apk/debug/app-debug.apk
      - name: Verify ZIP contents and ELF header
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'app/build/outputs/magisk/jianying-qr-magisk.zip'
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None, 'ZIP CRC check failed'
              names = set(archive.namelist())
              assert 'module.prop' in names, 'module.prop is missing from module root'
              assert 'zygisk/arm64-v8a.so' in names, 'Zygisk library is missing'
              assert 'META-INF/com/google/android/update-binary' in names, 'Magisk installer is missing'
              assert archive.read('zygisk/arm64-v8a.so')[:4] == b'\x7fELF', 'Native library is missing or invalid'
              assert archive.read('system/app/JianyingQrViewer/JianyingQrViewer.apk')[:2] == b'PK'
          print('Magisk module ZIP verified:', path)
          PY
      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: jianying-qr-magisk-module
          if-no-files-found: error
          path: app/build/outputs/magisk/jianying-qr-magisk.zip
      - name: Upload viewer APK separately
        uses: actions/upload-artifact@v4
        with:
          name: jianying-qr-viewer-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk
