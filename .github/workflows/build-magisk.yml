name: Build Magisk Zygisk module

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-magisk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build APK
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Build Zygisk library
        shell: pwsh
        run: ./build-zygisk.ps1 -NdkRoot (Join-Path $env:ANDROID_HOME 'ndk/27.2.12479018')
      - name: Package Magisk module
        shell: pwsh
        run: ./build-magisk.ps1 -ApkPath app/build/outputs/apk/debug/app-debug.apk
      - name: Verify ZIP contents and ELF header
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/magisk/jianying-qr-magisk.zip') as archive:
              assert archive.testzip() is None, 'ZIP CRC check failed'
              assert archive.read('zygisk/arm64-v8a.so')[:4] == b'\x7fELF', 'Native library is missing or invalid'
              assert archive.read('system/app/JianyingQrViewer/JianyingQrViewer.apk')[:2] == b'PK'
          PY
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: jianying-qr-magisk
          if-no-files-found: error
          path: |
            app/build/outputs/magisk/jianying-qr-magisk.zip
            app/build/outputs/apk/debug/app-debug.apk
